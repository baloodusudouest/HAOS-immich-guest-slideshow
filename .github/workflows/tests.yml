# Tests de l'intégration à chaque envoi (audit du 17/11/2026 : 138 tests existaient, aucun ne tournait sur GitHub)
name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component aioresponses pillow pytest-cov
      - run: python -m pytest -q
