refresh:
  name: Rafraîchir le diaporama
  description: >-
    Vide le cache, reconstruit les recherches Immich et recharge les photos.
    Sans paramètre, toutes les chambres sont rafraîchies.
  fields:
    room:
      name: Chambre
      description: >-
        Identifiant de la chambre (slug du nom, ex. chambre_d_ami).
        Optionnel : toutes les chambres si absent.
      required: false
      example: chambre_d_ami
      selector:
        text:

next:
  name: Image suivante
  description: >-
    Passe immédiatement à l'image suivante sans attendre la fin de
    l'intervalle. Sans paramètre, toutes les chambres avancent.
  fields:
    room:
      name: Chambre
      description: Identifiant de la chambre (optionnel).
      required: false
      example: chambre_stitch
      selector:
        text:

sync_albums:
  name: Synchroniser les albums Immich
  description: >-
    Crée ou met à jour un album Immich par lit occupé, contenant un
    échantillon aléatoire des photos de son occupant. Sert à alimenter un
    cadre photo qui ne sait pas recevoir d'image automatiquement : il suffit
    de télécharger l'album depuis l'app Immich puis de l'envoyer au cadre.
    Sans paramètre, toutes les chambres sont traitées.
  fields:
    room:
      name: Chambre
      description: >-
        Identifiant de la chambre (slug du nom, ex. chambre_d_ami).
        Optionnel : toutes les chambres si absent.
      required: false
      example: chambre_d_ami
      selector:
        text:
    size:
      name: Photos par album
      description: Nombre de photos placées dans chaque album.
      required: false
      default: 50
      example: 50
      selector:
        number:
          min: 1
          max: 500
          step: 5
          mode: box

link_person:
  name: Lier un nom à une personne Immich
  description: >-
    Mémorise que le nom saisi (dans un helper invité ou dans les personnes
    permanentes) correspond à la personne Immich dont vous donnez l'ID. La
    liaison est conservée et prime ensuite sur la recherche par nom.
  fields:
    name:
      name: Nom
      description: Le nom tel qu'il est saisi dans le helper.
      required: true
      example: Alexia
      selector:
        text:
    person_id:
      name: ID de la personne Immich
      description: >-
        UUID de la personne, ou URL de sa fiche dans Immich
        (http://…/people/…).
      required: true
      example: 1238c4da-3b98-41b9-b795-81d51e95a6d5
      selector:
        text:

unlink_person:
  name: Effacer une liaison nom / personne Immich
  description: >-
    Supprime la liaison mémorisée pour un nom. Sans nom, toutes les liaisons
    sont effacées. Le service renvoie le nombre de liaisons supprimées.
  fields:
    name:
      name: Nom
      description: Le nom dont la liaison doit être effacée (optionnel).
      required: false
      example: Alexia
      selector:
        text:

picpak_urls:
  name: "PicPak : URL des cadres"
  description: >-
    Renvoie, pour chaque cadre e-ink PicPak (cadres de chaque chambre et de
    sa porte), l'URL à enregistrer dans le cadre avec la commande SETURL de la
    console du firmware. L'URL contient le jeton d'accès des cadres : ne la
    partagez pas.
  fields:
    base_url:
      name: URL de base
      description: >-
        URL locale de Home Assistant telle que le cadre l'appelle, ex.
        http://192.168.1.29:8123. Optionnel : réglage des options, sinon URL
        locale détectée par Home Assistant.
      required: false
      example: http://192.168.1.29:8123
      selector:
        text:

picpak_next:
  name: "PicPak : photo suivante"
  description: >-
    Fait passer les cadres photo (dans les chambres) à la photo suivante. Un
    cadre ne peut pas être réveillé à distance : le changement a lieu à son
    prochain réveil, ou tout de suite si l'on appuie sur son bouton. Sans
    paramètre, tous les cadres.
  fields:
    room:
      name: Chambre
      description: Identifiant de la chambre (optionnel).
      required: false
      example: chambre_d_ami
      selector:
        text:
    bed:
      name: Cadre
      description: Numéro du cadre dans la chambre (1 ou 2). Optionnel.
      required: false
      example: 1
      selector:
        number:
          min: 1
          max: 2
          mode: box
