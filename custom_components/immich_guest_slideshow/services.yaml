refresh:
  name: Rafraîchir le diaporama
  description: >-
    Vide le cache, reconstruit les recherches Immich et recharge les photos.
    Sans paramètre, toutes les chambres sont rafraîchies.
  fields:
    room:
      name: Chambre
      description: >-
        Identifiant de la chambre (slug du nom, ex. chambre_d_ami).
        Optionnel : toutes les chambres si absent.
      required: false
      example: chambre_d_ami
      selector:
        text:

next:
  name: Photo suivante
  description: >-
    Passe immédiatement à la photo suivante du diaporama (le minuteur repart
    de zéro). Cibler la chambre par l'image de son diaporama (entity_id) ou
    par son identifiant (room). Sans paramètre, toutes les chambres.
  fields:
    entity_id:
      name: Diaporama
      description: Image du diaporama de la chambre (optionnel).
      required: false
      example: image.immich_chambre_ami
      selector:
        entity:
          integration: immich_guest_slideshow
          domain: image
    room:
      name: Chambre
      description: Identifiant de la chambre (optionnel).
      required: false
      example: chambre_stitch
      selector:
        text:

previous:
  name: Photo précédente
  description: >-
    Revient à la photo précédente du diaporama (le minuteur repart de zéro).
    Cibler la chambre par l'image de son diaporama (entity_id) ou par son
    identifiant (room).
  fields:
    entity_id:
      name: Diaporama
      description: Image du diaporama de la chambre (optionnel).
      required: false
      example: image.immich_chambre_ami
      selector:
        entity:
          integration: immich_guest_slideshow
          domain: image
    room:
      name: Chambre
      description: Identifiant de la chambre (optionnel).
      required: false
      example: chambre_stitch
      selector:
        text:


link_person:
  name: Lier un nom à une personne Immich
  description: >-
    Mémorise que le nom saisi (dans un helper invité ou dans les personnes
    permanentes) correspond à la personne Immich dont vous donnez l'ID. La
    liaison est conservée et prime ensuite sur la recherche par nom.
  fields:
    name:
      name: Nom
      description: Le nom tel qu'il est saisi dans le helper.
      required: true
      example: Alexia
      selector:
        text:
    person_id:
      name: ID de la personne Immich
      description: >-
        UUID de la personne, ou URL de sa fiche dans Immich
        (http://…/people/…).
      required: true
      example: 1238c4da-3b98-41b9-b795-81d51e95a6d5
      selector:
        text:

unlink_person:
  name: Effacer une liaison nom / personne Immich
  description: >-
    Supprime la liaison mémorisée pour un nom. Sans nom, toutes les liaisons
    sont effacées. Le service renvoie le nombre de liaisons supprimées.
  fields:
    name:
      name: Nom
      description: Le nom dont la liaison doit être effacée (optionnel).
      required: false
      example: Alexia
      selector:
        text:

picpak_urls:
  name: "PicPak : URL des cadres"
  description: >-
    Renvoie, pour chaque cadre e-ink PicPak (cadres de chaque chambre et de
    sa porte), l'URL à enregistrer dans le cadre avec la commande SETURL de la
    console du firmware. L'URL contient le jeton d'accès des cadres : ne la
    partagez pas.
  fields:
    base_url:
      name: URL de base
      description: >-
        URL locale de Home Assistant telle que le cadre l'appelle, ex.
        http://192.168.1.29:8123. Optionnel : réglage des options, sinon URL
        locale détectée par Home Assistant.
      required: false
      example: http://192.168.1.29:8123
      selector:
        text:

picpak_next:
  name: "PicPak : photo suivante"
  description: >-
    Fait passer les cadres photo (dans les chambres) à la photo suivante. Un
    cadre ne peut pas être réveillé à distance : le changement a lieu à son
    prochain réveil, ou tout de suite si l'on appuie sur son bouton. Sans
    paramètre, tous les cadres.
  fields:
    room:
      name: Chambre
      description: Identifiant de la chambre (optionnel).
      required: false
      example: chambre_d_ami
      selector:
        text:
    bed:
      name: Cadre
      description: Numéro du cadre dans la chambre (1 ou 2). Optionnel.
      required: false
      example: 1
      selector:
        number:
          min: 1
          max: 2
          mode: box

portrait_choices:
  name: "Portrait : photos proposées"
  description: >-
    Les 3 meilleures photos de Carnet (Photos HD) pour un invité, chacune
    avec l'adresse d'une simulation du cadre PicPak de la porte, et le choix
    actuel. Utilisé par la carte de réservation (Carnet doit être configuré).
  fields:
    room:
      name: Chambre
      description: Identifiant, nom, calendrier ou helper d'invité de la chambre.
      required: true
      example: calendar.chambre_ami
      selector:
        text:
    name:
      name: Invité
      description: Nom de l'invité (nom Immich, UUID ou « Nom (dates) »).
      required: true
      example: Paul Martin
      selector:
        text:
    arrivee:
      name: Arrivée
      description: Premier jour du séjour (pour la date de la simulation).
      required: false
      example: "2026-10-31"
      selector:
        date:
    depart:
      name: Départ
      description: Dernier jour du séjour.
      required: false
      example: "2026-11-01"
      selector:
        date:

portrait_choose:
  name: "Portrait : choisir la photo des cadres"
  description: >-
    Mémorise la photo (candidat Photos HD de Carnet) affichée pour cet invité
    sur les cadres PicPak et dans l'attribut portraits. Sans photo :
    retour au portrait automatique. Contact iPhone et Immich inchangés.
  fields:
    person_id:
      name: Personne Immich
      description: UUID de la personne (renvoyé par portrait_choices). Sinon room + name.
      required: false
      selector:
        text:
    room:
      name: Chambre
      description: Identifiant, nom, calendrier ou helper d'invité de la chambre.
      required: false
      selector:
        text:
    name:
      name: Invité
      description: Nom de l'invité.
      required: false
      selector:
        text:
    asset:
      name: Photo
      description: Identifiant de la photo choisie ; vide = automatique.
      required: false
      selector:
        text:
